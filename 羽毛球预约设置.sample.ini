# 羽毛球独立配置；网球仍由 run.sh 和「预约设置.ini」控制。
# 账号、密码、手机号、验证码平台与 config.ini 共用。
[reservation]
venue = 邱德拔体育馆-羽毛球场

# 每天打球。1=周一，7=周日。
# 指定某一天时填写 date（如 2026-11-03），并清空 weekdays。
date =
weekdays = 1,2,3,4,5,6,7

# 晚上 9–10 点，必须约到完整一小时。
start_time = 21:00
end_time = 22:00

# 按这个顺序尝试，只成功预约其中一个，不会改约列表外的场地。
courts = 3,4,5,8,9

[execution]
# 按原项目的邱德拔羽毛球规则：提前三天，中午 12 点放号。
# 如系统规则变化，可单独修改这里，不影响网球配置。
advance_days = 3
release_time = 12:00:00
auto_pay = false
# 从下一次放号开始（含刚放号的5分钟），不补订较早已放出的多天场次。
# 需要补订已放号的场地时，可以用固定 date，或主动改为 true。
catch_up = false
attempts = 20
retry_interval = 1
