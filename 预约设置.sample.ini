# 日常只需修改下面五项。账号仍保存在 config.ini。
[reservation]
# 可填下面的场馆全名，或智慧场馆网址里的数字 ID。
# 五四体育中心-室外网球场 = 85
# 五四体育中心-羽毛球馆 = 86
# 邱德拔体育馆-羽毛球场 = 60
venue = 五四体育中心-室外网球场

# 实际打球日期，例如 2026-10-30。上次 2026-10-27 已预约，先留空等你填新日期。
date =
# 每周循环时 date 留空，填实际打球的星期，如 2,3,4,5；只抢一次则留空。
weekdays =

# 必须完整约到这段时间；不自动缩短或换时间。
start_time = 06:00
end_time = 07:00

# 只预约这些场地。写 1 表示只要 1 号；写 1,2 表示优先 1 号，其次 2 号。
# 篮球等非数字场地可以填写系统里的完整名称，如 南1。
courts = 1

[execution]
# 北京时间：提前几天、几点放号。按实际场馆规则修改。
advance_days = 3
release_time = 12:00:00

# 默认不自动付款。如确实需要自动校园卡付款，再主动改为 true。
auto_pay = false

# 一次运行最多尝试这些轮；成功一单后结束，不每天重复。
# 每轮验证码识别可能消耗题分。
attempts = 20
retry_interval = 1
