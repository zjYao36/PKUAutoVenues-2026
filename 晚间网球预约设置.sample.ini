# 晚间网球独立配置，仅时间改为19:00–21:00，原网球设置保持不变。
# 账号仍与 config.ini 共用。
[reservation]
# 可填下面的场馆全名，或智慧场馆网址里的数字 ID。
# 五四体育中心-室外网球场 = 85
# 五四体育中心-羽毛球馆 = 86
# 邱德拔体育馆-羽毛球场 = 60
venue = 五四体育中心-室外网球场

# 每周循环：date 留空，weekdays 填实际打球的星期；1=周一，7=周日。
# 若只抢指定日期：填写 date（如 2026-10-30），并清空 weekdays。
date = 
weekdays = 2,3,4,5

# 必须完整约到这段时间；不自动缩短或换时间。
start_time = 19:00
end_time = 21:00

# 只预约这些场地。写 1 表示只要 1 号；写 1,2 表示优先 1 号，其次 2 号。
# 篮球等非数字场地可以填写系统里的完整名称，如 南1。
courts = 2,3

[execution]
# 北京时间：提前几天、几点放号。按实际场馆规则修改。
advance_days = 1
release_time = 12:00:00

# 默认不自动付款。如确实需要自动校园卡付款，再主动改为 true。
auto_pay = false

# 每个打球日最多尝试这些轮；成功一单后等待下一打球日，每周循环。
# 每轮验证码识别可能消耗题分。
attempts = 20
retry_interval = 1
